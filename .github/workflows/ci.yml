name: CI

on:
  push:
    branches: [public-alpha]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clarklab
          POSTGRES_PASSWORD: clarklab
          POSTGRES_DB: clarklab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clarklab -d clarklab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w clarklab-api
      - run: npm test -w clarklab-api
        env:
          DATABASE_URL: postgresql://clarklab:clarklab@localhost:5432/clarklab
          JWT_SECRET: ci-test-jwt-secret
          INTEGRATION_ENCRYPTION_KEY: ci-test-integration-key
          SIGNUP_ACCESS_CODE: ci-test-signup-code
          VITEST: 'true'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w clarklab-frontend
      - run: npm run typecheck -w clarklab-frontend
      - run: npm run lint -w clarklab-frontend

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
        working-directory: clarklab-agent
